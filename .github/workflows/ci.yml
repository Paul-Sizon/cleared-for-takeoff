name: ci
on: [push, pull_request]
jobs:
  test:
    runs-on: ${{ matrix.os }}
    strategy:
      matrix:
        os: [ubuntu-latest, macos-latest]
        python: ["3.9", "3.13"]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python }}
      - run: python -m unittest discover tests -v
      - name: CLI smoke
        run: |
          python evals/fixtures/build_fixtures.py /tmp/fx
          python skills/cleared-for-takeoff/scripts/preflight.py /tmp/fx/swift-clean --ci
          ! python skills/cleared-for-takeoff/scripts/preflight.py /tmp/fx/swift-broken --ci > /dev/null
